name: Build Win7 CHM Editor

# 触发：推送到 main 时自动构建 + 手动触发按钮
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-win7:
    # windows-2019 的 VS2019 + Windows SDK 工具链兼容 Windows 7 的 CRT
    runs-on: windows-2019

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Verify Python version (must be <= 3.8 for Win7)
        run: python -c "import sys; assert sys.version_info[:2]==(3,8), sys.version"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # PyInstaller 4.10.1 = 最后一个支持 Windows 7 的版本
          python -m pip install "PyInstaller==4.10.1"
          # tkinterweb 可选：装不上不影响纯文本预览降级
          python -m pip install tkinterweb || echo "tkinterweb unavailable, using text preview"

      - name: Run tests (headless)
        run: python -m unittest discover -s tests -v

      - name: Build portable exe
        run: python build_win7_exe.py

      - name: Upload hhc.exe usage note
        # 官方 HTML Help Workshop 需用户自行获取 hhc.exe（微软许可限制，不内置）
        run: |
          echo "如需编译 CHM，请将 hhc.exe 放入 dist\CHMEditor\ 目录" > dist\CHMEditor\hhc说明.txt
          type dist\CHMEditor\README-编译CHM.txt

      - name: Upload artifact (portable zip)
        uses: actions/upload-artifact@v4
        with:
          name: CHMEditor-Win7
          path: dist\CHMEditor\
          retention-days: 90

      - name: Create release zip (for Releases page)
        run: |
          Compress-Archive -Path "dist\CHMEditor\*" -DestinationPath "CHMEditor-Win7.zip" -Force

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHMEditor-Win7.zip
          path: CHMEditor-Win7.zip
          retention-days: 90
