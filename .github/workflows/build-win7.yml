# -*- coding: utf-8 -*-
"""
Build CHM Editor into a Win7-portable exe.
PyInstaller 4.10.1 + Python 3.8 = last combo that supports Win7.
"""

import os
import sys
import subprocess

# ---- 关键修复：强制 UTF-8 输出，避免 CI (cp1252) 打印中文崩 ----
if hasattr(sys.stdout, "reconfigure"):
    sys.stdout.reconfigure(encoding="utf-8")
    sys.stderr.reconfigure(encoding="utf-8")

APP_NAME = "CHMEditor"
MAIN_SCRIPT = "chm_editor.py"
SPEC_DIR = "."
DIST_PATH = "dist"
WORK_PATH = "build"


def check_python_version():
    major, minor = sys.version_info[:2]
    if major > 3 or (major == 3 and minor > 8):
        print("[WARN] Python %d.%d detected. PyInstaller 4.10.1 officially "
              "supports up to 3.8. Build may fail." % (major, minor))
    else:
        print("[OK] Python %d.%d - Win7 compatible" % (major, minor))


def build():
    print("=" * 50)
    print("Building %s for Windows 7 ..." % APP_NAME)
    print("=" * 50)

    check_python_version()

    # 入口文件必须存在
    if not os.path.exists(MAIN_SCRIPT):
        print("[FATAL] %s not found in cwd: %s" % (MAIN_SCRIPT, os.getcwd()))
        print("Files here:", os.listdir("."))
        sys.exit(1)

    cmd = [
        sys.executable, "-m", "PyInstaller",
        "--name", APP_NAME,
        "--onefile",
        "--windowed",
        "--distpath", DIST_PATH,
        "--workpath", WORK_PATH,
        "--specpath", SPEC_DIR,
        MAIN_SCRIPT,
    ]

    print("[CMD] " + " ".join(cmd))
    result = subprocess.run(cmd, capture_output=True, text=True)
    print("----- PyInstaller STDOUT -----")
    print(result.stdout)
    print("----- PyInstaller STDERR -----")
    print(result.stderr)
    print("Return code:", result.returncode)

    if result.returncode != 0:
        sys.exit(result.returncode)

    exe_path = os.path.join(DIST_PATH, APP_NAME, APP_NAME + ".exe")
    if os.path.exists(exe_path):
        print("\n[SUCCESS] %s" % exe_path)
        print("Copy the whole '%s' folder to the target Win7 machine." % APP_NAME)
    else:
        print("\n[FATAL] exe not found at %s" % exe_path)
        if os.path.exists(DIST_PATH):
            print("dist contents:", os.listdir(DIST_PATH))
        sys.exit(1)


if __name__ == "__main__":
    build()

